<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gradientes de los Nuevos Colores Corporativos DMD -->
    <linearGradient id="dmdGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="dmdGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="dmdGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="dmdGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="dmdGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#2563eb" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Fondo Redondeado Blanco Puro Corporativo -->
  <rect width="512" height="512" rx="110" fill="#ffffff" stroke="#e2e8f0" stroke-width="4"/>

  <!-- Grupo Isotipo Central (4 Módulos con los Nuevos Colores) -->
  <g transform="translate(146, 75)" filter="url(#dmdGlow)">
    <!-- Cuadrante 1: Superior Izquierdo (Azul Cielo / Eléctrico) -->
    <rect x="0" y="0" width="102" height="102" rx="26" fill="url(#dmdGrad1)"/>
    <!-- Cuadrante 2: Superior Derecho (Azul Real) -->
    <rect x="118" y="0" width="102" height="102" rx="26" fill="url(#dmdGrad2)"/>
    <!-- Cuadrante 3: Inferior Izquierdo (Azul Cobalto) -->
    <rect x="0" y="118" width="102" height="102" rx="26" fill="url(#dmdGrad3)"/>
    <!-- Cuadrante 4: Inferior Derecho (Azul Marino Profundo) -->
    <rect x="118" y="118" width="102" height="102" rx="26" fill="url(#dmdGrad4)"/>
  </g>

  <!-- Tipografía DMD Principal -->
  <text x="256" y="375" text-anchor="middle" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="68" font-weight="900" fill="#0f172a" letter-spacing="-1.5">DMD</text>

  <!-- Leyenda Subtítulo Oficial -->
  <text x="256" y="415" text-anchor="middle" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#2563eb" letter-spacing="4">DIGITAL MIJMA DREAMS</text>
  <text x="256" y="442" text-anchor="middle" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#64748b" letter-spacing="2">SOFTWARE &amp; IA PROFESIONAL</text>
</svg>
